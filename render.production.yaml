# Live Cast production Blueprint for a paid service with a persistent disk.
# This repository uses render.yaml for a new paid production service.
# Optional staging is in render.staging.yaml.
services:
  - type: web
    name: live-cast-scoreboard-production
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    disk:
      name: livecast-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: LIVECAST_ENV
        value: production
      - key: LIVECAST_REMOTE_TEST
        value: "1"
      - key: PUBLIC_OVERLAYS
        value: "1"
      - key: PAGES_ORIGIN
        value: https://heathlyon.github.io
      - key: LIVECAST_PAGES_URL
        value: https://heathlyon.github.io/Live_Cast_Control_Room/
      - key: LIVECAST_DB
        value: /var/data/livecast.sqlite3
      - key: LIVECAST_PERSISTENT_ROOT
        value: /var/data
      - key: LIVECAST_REQUIRE_MOUNT
        value: "1"
      - key: LIVECAST_SEED_CAST
        value: "0"
      - key: LIVECAST_SERVER_QUEUE
        value: "1"
      - key: LIVECAST_ALERT_SECONDS
        value: "6"
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LIVECAST_USERS_JSON
        sync: false # Secret JSON: named accounts and their scrypt hashes.
      # OPERATOR_PASSWORD is staging-only and should not be used as a shared
      # login in production.
      - key: VIEW_TOKEN
        generateValue: true
# Set YOUTUBE_API_KEY in Render Environment when the channel is ready.

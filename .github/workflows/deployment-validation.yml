name: Deployment validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.11'
          cache: pip
      - name: Install and check production dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "from app import app; assert app.router.lifespan_context"
      - name: Run the full test suite
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
